# SonarQube Cloud analysis for the whole monorepo.
#
# The scanner runs from the repository root rather than through the Maven plugin: that plugin
# resolves sonar.sources against its own module directory, so it can never index apps/web. Anchored
# here, one analysis covers both applications.
sonar.organization=gameoversv
sonar.projectKey=Gameoversv_DaleVenta
sonar.projectName=DaleVenta

sonar.sources=apps/api/src/main/java,apps/web/src
sonar.tests=apps/api/src/test/java
# Web tests live beside the code they cover, so they are classified by filename instead of directory.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Java analysis needs compiled output; the workflow runs `mvnw verify` before scanning.
sonar.java.binaries=apps/api/target/classes
sonar.java.test.binaries=apps/api/target/test-classes
sonar.java.libraries=apps/api/target/dependency/*.jar

sonar.coverage.jacoco.xmlReportPaths=apps/api/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info

sonar.exclusions=**/node_modules/**,**/.next/**,**/target/**,apps/web/e2e/**
sonar.sourceEncoding=UTF-8
