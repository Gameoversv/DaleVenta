name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Dependencies rot without any code change, so re-scan every Monday at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency vulnerabilities (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # Trivy resolves parent POMs and BOMs to expand the Spring Boot dependency tree. Without a
      # populated local repository it fetches them from Maven Central and gets rate limited (429),
      # so prime ~/.m2 first and run Trivy as a binary on the runner rather than in a container
      # that cannot see that cache.
      - name: Prime the Maven repository
        working-directory: apps/api
        run: ./mvnw -q -B dependency:resolve

      # The upstream action installs a pinned release on the runner. Piping the vendor install
      # script into a shell would work too, but it is the "curl | sh" pattern our own Semgrep
      # ruleset rejects, and rightly so.
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.72.0

      # Reads pom.xml and package-lock.json, so transitive dependencies are covered without a build.
      # --ignore-unfixed keeps the gate on findings that actually have an upgrade path.
      - name: Scan Maven and npm dependencies
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db
        run: |
          trivy fs . \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --skip-dirs '**/node_modules' \
            --skip-dirs '**/target' \
            --exit-code 1 \
            --format table

      # Report-only on purpose. npm audit currently flags advisories whose only "fix" is a
      # downgrade to an ancient major (e.g. sharp, pulled in by Next.js), so it cannot gate the
      # build without being permanently red. Trivy above is the gate: --ignore-unfixed keeps it
      # focused on findings that actually have an upgrade path.
      - name: npm audit (report only)
        working-directory: apps/web
        run: npm audit --omit=dev || true

  secrets:
    name: Leaked secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret removed in a later commit is still a leaked secret.
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Scan git history
        run: gitleaks detect --source . --redact --verbose --config .gitleaks.toml

  static-analysis:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.97.0
    steps:
      - uses: actions/checkout@v4

      # Community rulesets only, so no Semgrep account or token is required.
      #
      # Two rules are excluded globally, with the reasoning recorded here rather than as
      # scattered inline suppressions:
      #  - mutable-action-tag: we track the maintained major tags (@v4) of first-party actions
      #    instead of pinning commit SHAs, so security patches arrive without a manual bump.
      #  - detected-bcrypt-hash: fires on V34, an already-applied Flyway migration whose contents
      #    cannot change without breaking checksum validation on live databases. The credential it
      #    referenced is no longer a default (see DataSeeder).
      #  - request-host-used: nginx forwards Host to internal container upstreams that never build
      #    URLs or cache keys from it. Generic-mode rules ignore inline nosemgrep markers, so the
      #    exclusion has to live here.
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/java \
            --config p/typescript \
            --config p/secrets \
            --metrics off \
            --error \
            --skip-unknown-extensions \
            --exclude-rule yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag \
            --exclude-rule generic.secrets.security.detected-bcrypt-hash.detected-bcrypt-hash \
            --exclude-rule generic.nginx.security.request-host-used.request-host-used \
            --exclude 'apps/web/e2e' \
            --exclude '**/target/**' \
            --exclude '**/node_modules/**' \
            --exclude '**/.next/**' \
            --exclude '.claude/**'

  containers:
    name: Container and IaC misconfiguration (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.72.0

      - name: Scan Dockerfiles and compose definitions
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db
        run: |
          trivy config . \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format table
