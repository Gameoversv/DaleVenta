name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  api-test:
    name: API Tests (Spring Boot)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dalventa_test
          POSTGRES_USER: dalventa
          POSTGRES_PASSWORD: changeme
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # `verify` runs the tests and then the JaCoCo coverage gate, which fails the build
      # if line coverage drops below the threshold configured in apps/api/pom.xml.
      - name: Run API tests and coverage gate
        working-directory: apps/api
        run: ./mvnw verify -Dspring.profiles.active=test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: dalventa_test
          DB_USER: dalventa
          DB_PASSWORD: changeme
          JWT_SECRET: ci-test-secret-256-bits-minimum-length-ok

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: apps/api/target/surefire-reports/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage-report
          path: apps/api/target/site/jacoco/

  web-test:
    name: Web Tests (Vitest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci --ignore-scripts

      - name: Type check
        working-directory: apps/web
        run: ./node_modules/.bin/tsc --noEmit

      - name: Unit tests
        working-directory: apps/web
        run: npm run test:coverage

      - name: Production build
        working-directory: apps/web
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage-report
          path: apps/web/coverage/
