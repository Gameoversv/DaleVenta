name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  api-test:
    name: API Tests (Spring Boot)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dalventa_test
          POSTGRES_USER: dalventa
          POSTGRES_PASSWORD: changeme
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # `verify` runs the tests and then the JaCoCo coverage gate, which fails the build
      # if line coverage drops below the threshold configured in apps/api/pom.xml.
      - name: Run API tests and coverage gate
        working-directory: apps/api
        run: ./mvnw verify -Dspring.profiles.active=test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: dalventa_test
          DB_USER: dalventa
          DB_PASSWORD: changeme
          JWT_SECRET: ci-test-secret-256-bits-minimum-length-ok

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: apps/api/target/surefire-reports/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage-report
          path: apps/api/target/site/jacoco/

  web-test:
    name: Web Tests (Vitest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci --ignore-scripts

      - name: Type check
        working-directory: apps/web
        run: ./node_modules/.bin/tsc --noEmit

      # The lint config had been silently throwing on every invocation and no job ran it, so the
      # errors it reports here had never been seen. Kept non-blocking on warnings only: any error
      # fails the build.
      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Unit tests
        working-directory: apps/web
        run: npm run test:coverage

      - name: Production build
        working-directory: apps/web
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage-report
          path: apps/web/coverage/

  # The end-to-end suite had gone stale precisely because nothing ran it: eight of its ten specs
  # were failing against navigation and copy that had since changed, and no build ever noticed.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dalventa_e2e
          POSTGRES_USER: dalventa
          POSTGRES_PASSWORD: changeme
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Build the API
        working-directory: apps/api
        run: ./mvnw -q -B package -DskipTests

      # The specs drive the real stack, so a broken contract between web and API surfaces here
      # rather than being mocked away.
      - name: Start the API
        working-directory: apps/api
        run: |
          nohup java -jar target/api-*.jar > api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health > /dev/null && exit 0
            sleep 3
          done
          echo "API did not become healthy"
          cat api.log
          exit 1
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: dalventa_e2e
          DB_USER: dalventa
          DB_PASSWORD: changeme
          JWT_SECRET: e2e-ci-secret-256-bits-minimum-length-ok
          CORS_ALLOWED_ORIGINS: http://localhost:3000
          # Registration is capped at five per minute per IP. Every spec registers its own tenant
          # from the same address, which is precisely the traffic that cap exists to throttle, so
          # the whole suite would fail on a 429 once it grew past five specs.
          RATE_LIMIT_ENABLED: "false"
          # The super admin is seeded by the API rather than registered through the UI, so the
          # specs need a password they can predict. These are throwaway values for a database that
          # is created and destroyed with this job — never reuse a deployed environment's secrets
          # here, and never commit one. e2e/support/super-admin.ts reads the same defaults.
          APP_SEED_SUPER_ADMIN_PASSWORD: E2eSuperAdmin123!
          APP_SEED_ADMIN_PASSWORD: E2eAdmin123!

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      # playwright.config.ts starts `npm run dev` itself and waits for the port.
      - name: Run the specs
        working-directory: apps/web
        run: npx playwright test --reporter=line

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            apps/web/test-results/
            apps/api/api.log
