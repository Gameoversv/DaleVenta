name: DAST

# Dynamic scan against a real running API. It boots a throwaway stack, so it is slower and
# noisier than the static checks: it runs on a schedule and on demand, never blocking pull
# requests.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    name: ZAP baseline scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build API image
        working-directory: apps/api
        run: docker build -t dalventa-api:dast .

      # Everything runs on one user-defined network so ZAP can reach the API by container name;
      # targeting localhost from inside the ZAP container would not resolve.
      - name: Start throwaway stack
        run: |
          docker network create dast
          docker run -d --name dast-db --network dast \
            -e POSTGRES_DB=dalventa -e POSTGRES_USER=dalventa -e POSTGRES_PASSWORD=dast-only-password \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec dast-db pg_isready -U dalventa -d dalventa && break
            sleep 2
          done
          docker run -d --name dast-api --network dast \
            -e DB_HOST=dast-db -e DB_PORT=5432 -e DB_NAME=dalventa \
            -e DB_USER=dalventa -e DB_PASSWORD=dast-only-password \
            -e JWT_SECRET=dast-only-secret-256-bits-minimum-length-ok \
            -e CORS_ALLOWED_ORIGINS=http://localhost:3000 \
            dalventa-api:dast

      - name: Wait for the API to become healthy
        run: |
          for i in $(seq 1 60); do
            if docker run --rm --network dast curlimages/curl:8.11.1 \
                 -fsS http://dast-api:8080/actuator/health > /dev/null 2>&1; then
              echo "API is up"
              exit 0
            fi
            sleep 5
          done
          echo "API did not become healthy in time"
          docker logs dast-api
          exit 1

      - name: Run ZAP baseline
        run: |
          mkdir -p zap-report && chmod 777 zap-report
          docker run --rm --network dast -v "$PWD/zap-report:/zap/wrk:rw" \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://dast-api:8080 \
            -r report.html -w report.md -J report.json \
            || ZAP_EXIT=$?
          # zap-baseline.py exits 1 only when a rule reaches FAIL level; warnings exit 2.
          if [ "${ZAP_EXIT:-0}" = "1" ]; then
            echo "ZAP reported at least one FAIL-level alert"
            exit 1
          fi

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: zap-report/

      - name: Tear down
        if: always()
        run: |
          docker logs dast-api > api.log 2>&1 || true
          docker rm -f dast-api dast-db || true
          docker network rm dast || true
