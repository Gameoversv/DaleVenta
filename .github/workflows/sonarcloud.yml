name: SonarCloud

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: SonarQube Cloud analysis
    runs-on: ubuntu-latest
    # Skips cleanly until the project is imported on sonarcloud.io and SONAR_TOKEN exists, so the
    # workflow can sit in the repository before the setup is finished. Flip the SONAR_ENABLED
    # repository variable to true to turn it on.
    if: ${{ vars.SONAR_ENABLED == 'true' }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Sonar uses git history to assign issues to authors and to compute new-code periods.
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # Sonar reports coverage from the reports the build produces; it does not run the tests
      # itself. Both suites therefore have to run before the scanner.
      - name: Backend tests with coverage
        working-directory: apps/api
        run: ./mvnw -B verify -Dspring.profiles.active=test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: dalventa_test
          DB_USER: dalventa
          DB_PASSWORD: changeme
          JWT_SECRET: ci-test-secret-256-bits-minimum-length-ok

      - name: Frontend tests with coverage
        working-directory: apps/web
        run: |
          npm ci --ignore-scripts
          npm run test:coverage

      # Without the dependency jars the Java analyser degrades to a partial parse and warns loudly.
      - name: Collect Java dependencies for the analyser
        working-directory: apps/api
        run: ./mvnw -q -B dependency:copy-dependencies

      # Run from the repository root. The Maven plugin resolves sonar.sources against its own module
      # directory, so it could never reach apps/web; configuration lives in sonar-project.properties.
      - name: Run the scanner
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dalventa_test
          POSTGRES_USER: dalventa
          POSTGRES_PASSWORD: changeme
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
