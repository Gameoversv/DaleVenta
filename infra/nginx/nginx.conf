worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # Basic rate limiting: keyed by client IP, shared 10MB zone (~160k tracked IPs).
  limit_req_zone $binary_remote_addr zone=api_zone:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=web_zone:10m rate=30r/s;
  limit_req_status 429;

  # Cap request body size at the edge (mirrors API multipart limits).
  client_max_body_size 15m;

  server {
    listen 80;
    server_name _;

    location /api/ {
      limit_req zone=api_zone burst=20 nodelay;
      # No trailing slash: preserve the /api prefix so it reaches the backend,
      # whose controllers are mapped under /api/** (e.g. @RequestMapping("/api/auth")).
      proxy_pass http://api:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      limit_req zone=web_zone burst=50 nodelay;
      proxy_pass http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
