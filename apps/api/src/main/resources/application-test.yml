spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dalventa_test}
    username: ${DB_USER:dalventa}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    clean-on-validation-error: true
    clean-disabled: false
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

app:
  jwt:
    secret: ${JWT_SECRET:test-secret-key-256-bits-for-testing-purposes-only}
    expiration-hours: 1
  cors:
    allowed-origins: http://localhost:3000
  rate-limit:
    # Disabled for integration tests: the shared Spring context means many test classes issue
    # dozens of register/login calls from the same "IP" (localhost) in a short window.
    enabled: false
