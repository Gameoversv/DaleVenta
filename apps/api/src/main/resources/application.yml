spring:
  application:
    name: dalventa-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dalventa}
    username: ${DB_USER:dalventa}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 10000
      max-lifetime: 1800000
      idle-timeout: 600000
      leak-detection-threshold: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

  servlet:
    multipart:
      # Vehicle/damage reception photos. Keep image-sized; not a general document upload endpoint.
      max-file-size: 10MB
      max-request-size: 15MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
  tomcat:
    threads:
      max: 100
      min-spare: 10
    accept-count: 50
    connection-timeout: 20000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-256-bit-secret-in-production}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://web-production-f497.up.railway.app}
  storage:
    r2:
      endpoint: ${R2_ENDPOINT:}
      bucket: ${R2_BUCKET:dalventa-media}
      access-key: ${R2_ACCESS_KEY:}
      secret-key: ${R2_SECRET_KEY:}
      public-url: ${R2_PUBLIC_URL:http://localhost:9000/dalventa-media}
  rate-limit:
    # In-memory, per-instance token buckets. If the API is scaled to multiple instances,
    # replace with a distributed backend (e.g. bucket4j-redis) so limits apply globally.
    enabled: ${RATE_LIMIT_ENABLED:true}
    ip:
      capacity: 20
      refill-minutes: 1
    login:
      capacity: 5
      refill-minutes: 1
    register:
      capacity: 5
      refill-minutes: 1
    portal-login:
      capacity: 5
      refill-minutes: 1
